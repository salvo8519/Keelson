# Pipeline of the Keelson repository (the template's own CI for generated projects lives in
# template/.gitlab-ci.yml.jinja). Images are pinned; jobs run with the default, read-only token.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages: [check, test, docs]

default:
  image: ghcr.io/astral-sh/uv:0.11-python3.13-bookworm
  interruptible: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - uv sync --all-groups --frozen

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

cache:
  key:
    files: [uv.lock]
  paths: [.uv-cache]

check:
  stage: check
  script:
    - uv run just style yaml python skills-lock agents i18n

render:
  stage: test
  script:
    - uv run just test

generated:
  stage: test
  # The default project, rendered and tested end to end (backend suite), with a real
  # PostgreSQL so that the row level security tests run instead of being skipped.
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: acme_service
  variables:
    POSTGRES_HOST: postgres
    POSTGRES_PASSWORD: postgres
  script:
    - uv run just test-generated
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [template/**/*, copier.yml, copier/**/*]

docs:
  stage: docs
  script:
    - uv run just docs
  artifacts:
    paths: [site]
    expire_in: 1 week

pages:
  stage: docs
  needs: [docs]
  before_script: []
  script:
    - mv site public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
