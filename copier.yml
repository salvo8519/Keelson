# Keelstone: enterprise FastAPI project template (agent profile).
# Questions are grouped as: identity, brand, stack axes, delivery.
# Upstream-derived variables live in copier/vstorm.yml (generated, do not edit).

_min_copier_version: "9.4.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

_exclude:
  - "_includes"
  - "{% if web_frontend == 'none' %}frontend{% endif %}"
  - "{% if 'it' not in languages %}backend/app/locales/it{% endif %}"
  - "{% if 'it' not in languages %}frontend/src/locales/it.json{% endif %}"
  - "{% if 'it' not in languages %}backend/emails/compiled/it{% endif %}"
  - "{% if 'it' not in languages %}docs/it{% endif %}"
  - "{% if 'it' not in languages %}i18n/it.yaml{% endif %}"
  - "{% if logfire %}backend/app/core/telemetry.py{% endif %}"

_tasks:
  - command: [python3, _post_gen.py]
  - command: [python3, -c, "import os; os.remove('_post_gen.py')"]

_message_after_copy: |
  {{ brand_name }} is ready in {{ _copier_conf.dst_path }}.
  Next steps: see README.md (quick start) and AGENTS.md (how to work on the project).

# --- Identity -------------------------------------------------------------
project_name:
  type: str
  help: Project name in snake_case (used for the Python package and the CLI)
  default: my_project
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Use lowercase letters, digits and underscores, starting with a letter.
    {% endif %}

project_slug:
  type: str
  when: false
  default: "{{ project_name.lower().replace('-', '_') }}"

project_description:
  type: str
  help: One-line description
  default: An enterprise FastAPI service

author_name:
  type: str
  help: Author or organization name
  default: Your Name

author_email:
  type: str
  help: Author contact email
  default: you@example.com

security_contact:
  type: str
  help: Address that receives vulnerability reports (SECURITY.md); empty for private advisories only
  default: "{{ '' if author_email.endswith('@example.com') else author_email }}"

timezone:
  type: str
  help: IANA timezone used by schedulers and logs
  default: UTC

# --- Brand (white label) ---------------------------------------------------
repository_url:
  type: str
  help: URL of the project's repository (documentation site and its edit links)
  default: "https://github.com/your-org/{{ project_name | replace('_', '-') }}"
  validator: >-
    {% if not (repository_url | regex_search('^https://[^/]+/[^/]+/[^/]+$')) %}
    Use the repository's HTTPS URL, such as https://github.com/acme/acme-service.
    {% endif %}

brand_name:
  type: str
  help: Product name shown in the UI and in the API reference
  default: "{{ project_name | replace('_', ' ') | title }}"

brand_primary_color:
  type: str
  help: Primary brand color (hex)
  default: "#1F3A5F"
  validator: >-
    {% if not (brand_primary_color | regex_search('^#[0-9A-Fa-f]{6}$')) %}
    Use a 6-digit hex color such as #1F3A5F.
    {% endif %}

languages:
  type: str
  help: Languages of the interface and of API messages (English is the source language)
  multiselect: true
  choices:
    English: en
    Italiano: it
  default: [en, it]
  validator: >-
    {% if 'en' not in languages %}English is the source language and cannot be removed.{% endif %}

# --- Stack axes --------------------------------------------------------------
web_frontend:
  type: str
  help: Web frontend
  choices:
    React (Vite, TanStack, shadcn/ui): react
    None (API only): none
  default: react

task_backend:
  type: str
  help: Background task queue and scheduler
  choices:
    Taskiq (async-native): taskiq
    Celery: celery
    ARQ: arq
  default: taskiq

ai_framework:
  type: str
  help: Agent framework
  choices:
    Pydantic AI: pydantic_ai
    LangGraph: langgraph
    LangChain (experimental in Keelstone): langchain
    Deep Agents (experimental in Keelstone): deepagents
    Pydantic Deep (experimental in Keelstone): pydantic_deep
  default: pydantic_ai

llm_provider:
  type: str
  help: LLM provider
  choices:
    OpenAI: openai
    Anthropic: anthropic
    Google Gemini: google
    OpenRouter: openrouter
    OpenAI-compatible server (Ollama, vLLM, on-premise gateways): openai_compatible
    All providers (choose at runtime): all
  default: openai
  validator: >-
    {% if llm_provider in ['openrouter', 'openai_compatible']
          and ai_framework not in ['pydantic_ai', 'pydantic_deep'] %}
    This provider requires Pydantic AI or Pydantic Deep.
    {% endif %}

vector_database:
  type: str
  help: Vector database for retrieval (RAG)
  choices:
    None: none
    Qdrant: qdrant
    pgvector (PostgreSQL): pgvector
  default: qdrant

# --- Delivery ----------------------------------------------------------------
ci_provider:
  type: str
  help: CI/CD system for the generated project
  choices:
    GitHub Actions: github
    GitLab CI: gitlab
  default: github

kubernetes:
  type: bool
  help: Generate Kubernetes manifests
  default: true

logfire:
  type: bool
  help: Enable Pydantic Logfire (OpenTelemetry export is always available)
  default: false

# --- Tool versions ---------------------------------------------------------------
uv_version:
  type: str
  when: false
  # Single source of the uv release used by the generated project's CI (GitHub and GitLab) and
  # its backend image (docs/en/concepts/security-controls.md, supply chain).
  default: "0.13.10"

bun_version:
  type: str
  when: false
  # Single source of the Bun release of the generated frontend: CI (GitHub and GitLab) and the
  # build stage of frontend/Dockerfile.
  default: "1.4.4"

oasdiff_version:
  type: str
  when: false
  # Single source of the oasdiff release that checks the API contract for breaking changes in
  # both CI providers (scripts/openapi-breaking.sh verifies its published checksum).
  default: "1.35.0"

# --- Reverse proxy ---------------------------------------------------------------
proxy_network_subnet:
  type: str
  when: false
  # Single source of the default subnet of the network between the reverse proxy and the API
  # in docker-compose.prod.yml. The API trusts the X-Forwarded-* headers only from it
  # (FORWARDED_ALLOW_IPS); both can be changed with PROXY_NETWORK_SUBNET in backend/.env.
  default: 10.250.250.0/24

# --- Object storage --------------------------------------------------------------
garage_image:
  type: str
  when: false
  # Single source of the Garage image of the Compose stacks (dev and prod), pinned to a release.
  default: dxflrs/garage:v2.1.0

storage_bucket:
  type: str
  when: false
  # Default bucket of the object storage: S3 bucket names allow no underscore.
  default: "{{ project_slug | replace('_', '-') }}"

# --- Provenance ----------------------------------------------------------------
keelstone_url:
  type: str
  when: false
  # Single source of the template's home, used by NOTICE and README of generated projects.
  default: https://github.com/salvo8519/keelstone

generator_name:
  type: str
  when: false
  default: keelstone

generator_version:
  type: str
  when: false
  default: "{{ _copier_conf.vcs_ref_hash or 'local' }}"

generated_at:
  type: str
  when: false
  default: ""

--- !include copier/vstorm.yml
