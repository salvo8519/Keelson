# Garage (https://garagehq.deuxfleurs.fr), the S3-compatible object store of the Compose
# stacks: one node, one copy of every object. Garage is AGPLv3 software run as a separate
# service; this project does not link it (see docs/en/concepts/document-storage.md).
#
# No secret lives here. Garage reads them from its environment:
#   GARAGE_RPC_SECRET    32 bytes in hexadecimal (openssl rand -hex 32)
#   GARAGE_ADMIN_TOKEN   token of the administration API, used by `cmd garage-bootstrap`

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
