# Keelstone: security headers of the frontend, included by every location (an add_header inside a
# location replaces the ones of the server block). __API_ORIGIN__ is set at image build from
# VITE_API_URL (Dockerfile): scripts come only from this origin, API calls only from the API.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
