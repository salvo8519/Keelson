# Documentation site, built with Zensical (https://zensical.org).
# English edition (source). The Italian edition is generated: see scripts/docs.py and i18n/.
#   uv run just docs-serve [it]   (local preview)
#   uv run just docs              (both sites, strict; what CI runs)

[project]
site_name = "Keelson"
site_description = "Enterprise FastAPI project template with an agent layer, assembled from two proven open source templates."
site_url = "https://salvo8519.github.io/keelson/"
docs_dir = "docs/en"
site_dir = "site"
repo_url = "https://github.com/salvo8519/keelson"
repo_name = "salvo8519/keelson"
edit_uri = "edit/main/docs/en/"
copyright = "Copyright &copy; 2026 Salvatore Miseo and the Keelson contributors &middot; Apache License 2.0"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/index.md",
  ] },
  { "Concepts" = [
    "concepts/architecture.md",
    "concepts/tenancy-and-api-keys.md",
    "concepts/sign-in-and-workload-identity.md",
    "concepts/security-controls.md",
    "concepts/languages.md",
    "concepts/api-reference-and-observability.md",
    "concepts/assembly.md",
    "concepts/agent-skills.md",
  ] },
  { "Reference" = [
    "reference/questions.md",
  ] },
  { "Project" = [
    "project/provenance.md",
    "project/contributing.md",
    "project/release-notes.md",
    "project/changelog.md",
  ] },
]

[project.theme]
language = "en"
icon.repo = "fontawesome/brands/github"
logo = "assets/brand/mark-inverted.svg"
favicon = "assets/brand/mark.svg"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
alternate = [
  { name = "English", link = "https://salvo8519.github.io/keelson/", lang = "en" },
  { name = "Italiano", link = "https://salvo8519.github.io/keelson/it/", lang = "it" },
]

[project.plugins.search]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
